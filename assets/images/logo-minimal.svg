<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 60" width="100%" height="100%" fill="none">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@800;900&amp;family=JetBrains+Mono:wght@700&amp;display=swap');
      
      .brand-title {
        font-family: 'Orbitron', -apple-system, sans-serif;
        font-weight: 900;
        text-transform: uppercase;
        letter-spacing: 0.1em;
      }
      .glow-amber {
        filter: drop-shadow(0 0 8px rgba(255, 176, 0, 0.5));
      }
      .glow-magenta {
        filter: drop-shadow(0 0 8px rgba(255, 0, 85, 0.6));
      }
      .glow-cyan {
        filter: drop-shadow(0 0 6px rgba(0, 240, 255, 0.7));
      }
    </style>

    <linearGradient id="minAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE57F" />
      <stop offset="100%" stop-color="#FFB000" />
    </linearGradient>

    <linearGradient id="minMagenta" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2A85" />
      <stop offset="100%" stop-color="#FF0055" />
    </linearGradient>
  </defs>

  <!-- Minimal Icon Mark (48x48) -->
  <g transform="translate(6, 6)">
    <!-- Tech Frame Corners -->
    <path d="M 12,2 L 2,12 L 2,22" fill="none" stroke="#FFB000" stroke-width="2" class="glow-amber" />
    <path d="M 36,46 L 46,36 L 46,26" fill="none" stroke="#FF0055" stroke-width="2" class="glow-magenta" />
    
    <!-- Top G Bar (Amber) -->
    <path d="M 38,14 L 18,14 C 13,14 10,17 10,22 L 10,26 L 38,26" 
          fill="none" 
          stroke="url(#minAmber)" 
          stroke-width="4.5" 
          stroke-linecap="square" 
          class="glow-amber" />

    <!-- Glitch Slice Offset (Cyan tear) -->
    <g transform="translate(-3, 0)">
      <line x1="4" y1="26" x2="44" y2="26" stroke="#00F0FF" stroke-width="1.5" class="glow-cyan" />
      <rect x="22" y="24" width="8" height="4" fill="#00F0FF" class="glow-cyan" />
    </g>

    <!-- Bottom G Bar (Magenta) -->
    <path d="M 10,28 L 10,34 C 10,39 13,42 18,42 L 36,42 C 39,42 41,39 41,36 L 41,27 L 27,27" 
          fill="none" 
          stroke="url(#minMagenta)" 
          stroke-width="4.5" 
          stroke-linecap="square" 
          class="glow-magenta" />
  </g>

  <!-- Clean Typography Lockup -->
  <g transform="translate(70, 0)">
    <!-- GLITCH -->
    <text x="0" y="40" class="brand-title glow-amber" font-size="28" fill="url(#minAmber)">GLITCH</text>

    <!-- Slash // -->
    <text x="144" y="38" font-family="'JetBrains Mono', monospace" font-size="24" font-weight="700" fill="#FF0055" class="glow-magenta">//</text>

    <!-- GRID -->
    <text x="175" y="40" class="brand-title" font-size="28" fill="#FFFFFF">GRID</text>

    <!-- Glowing Accent Dot -->
    <circle cx="282" cy="36" r="3.5" fill="#00FF66" filter="drop-shadow(0 0 5px rgba(0, 255, 102, 0.8))" />
  </g>
</svg>
