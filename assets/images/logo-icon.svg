<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%" fill="none">
  <defs>
    <style>
      .glow-amber {
        filter: drop-shadow(0 0 8px rgba(255, 176, 0, 0.7)) drop-shadow(0 0 20px rgba(255, 176, 0, 0.35));
      }
      .glow-magenta {
        filter: drop-shadow(0 0 8px rgba(255, 0, 85, 0.75)) drop-shadow(0 0 18px rgba(255, 0, 85, 0.35));
      }
      .glow-cyan {
        filter: drop-shadow(0 0 6px rgba(0, 240, 255, 0.85));
      }
    </style>

    <linearGradient id="iconAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE066" />
      <stop offset="50%" stop-color="#FFB000" />
      <stop offset="100%" stop-color="#FF7700" />
    </linearGradient>

    <linearGradient id="iconMagenta" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2A85" />
      <stop offset="100%" stop-color="#FF0055" />
    </linearGradient>

    <linearGradient id="iconPlate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141726" />
      <stop offset="100%" stop-color="#07080d" />
    </linearGradient>

    <pattern id="iconGrid" width="12" height="12" patternUnits="userSpaceOnUse">
      <path d="M 12 0 L 0 0 0 12" fill="none" stroke="rgba(255, 176, 0, 0.12)" stroke-width="1" />
    </pattern>

    <!-- Slices for Glitch Distortion -->
    <clipPath id="iconSliceTop">
      <rect x="0" y="0" width="128" height="60" />
    </clipPath>
    <clipPath id="iconSliceMid">
      <rect x="0" y="60" width="128" height="15" />
    </clipPath>
    <clipPath id="iconSliceBtm">
      <rect x="0" y="75" width="128" height="53" />
    </clipPath>
  </defs>

  <!-- Dark Octagonal / Chamfered Cyber Frame Base -->
  <polygon points="32,6 96,6 122,32 122,96 96,122 32,122 6,96 6,32" 
           fill="url(#iconPlate)" 
           stroke="rgba(255, 176, 0, 0.3)" 
           stroke-width="2" />

  <!-- Embedded Cyber Grid -->
  <polygon points="32,6 96,6 122,32 122,96 96,122 32,122 6,96 6,32" 
           fill="url(#iconGrid)" />

  <!-- Outer HUD Corner Reticles -->
  <path d="M 22,10 L 10,22 L 10,40" fill="none" stroke="#FFB000" stroke-width="3" stroke-linecap="round" class="glow-amber" />
  <path d="M 106,118 L 118,106 L 118,88" fill="none" stroke="#FF0055" stroke-width="3" stroke-linecap="round" class="glow-magenta" />
  
  <path d="M 106,10 L 118,22" fill="none" stroke="rgba(255, 255, 255, 0.3)" stroke-width="2" stroke-linecap="round" />
  <path d="M 22,118 L 10,106" fill="none" stroke="rgba(255, 255, 255, 0.3)" stroke-width="2" stroke-linecap="round" />

  <!-- ================= GLITCH 'G' EMBLEM ================= -->
  
  <!-- Slice 1: Top Section (Amber Neon) -->
  <g clip-path="url(#iconSliceTop)">
    <path d="M 94,36 L 48,36 C 36,36 28,44 28,56 L 28,72" 
          fill="none" 
          stroke="url(#iconAmber)" 
          stroke-width="8.5" 
          stroke-linecap="square"
          class="glow-amber" />
    <!-- Secondary internal circuit line -->
    <path d="M 86,47 L 49,47 C 44,47 40,51 40,56" 
          fill="none" 
          stroke="#FFB000" 
          stroke-width="2" 
          opacity="0.5" />
  </g>

  <!-- Slice 2: Glitch Tear Mid-Section (Electric Cyan & Chromatic Shift) -->
  <g clip-path="url(#iconSliceMid)" transform="translate(-6, 0)">
    <!-- Cyan Abberation Track -->
    <path d="M 28,52 L 28,78 L 90,78 L 90,62 L 64,62" 
          fill="none" 
          stroke="#00F0FF" 
          stroke-width="8.5" 
          stroke-linecap="square"
          class="glow-cyan" />
    <!-- Glitch Beam Line extending across border -->
    <line x1="4" y1="67" x2="124" y2="67" stroke="#00F0FF" stroke-width="1.8" class="glow-cyan" />
    <rect x="74" y="65" width="16" height="4" fill="#00F0FF" />
  </g>

  <!-- Slice 3: Bottom Section (Cyber Magenta, shifted +3px right) -->
  <g clip-path="url(#iconSliceBtm)" transform="translate(3, 0)">
    <path d="M 28,70 C 28,82 36,90 48,90 L 84,90 C 94,90 100,84 100,74 L 100,60 L 64,60" 
          fill="none" 
          stroke="url(#iconMagenta)" 
          stroke-width="8.5" 
          stroke-linecap="square"
          class="glow-magenta" />
    <!-- Cyber cross-block -->
    <rect x="67" y="70" width="16" height="5" fill="#FF0055" class="glow-magenta" />
  </g>

  <!-- Core Aim Target / Optical Sensor -->
  <circle cx="64" cy="54" r="3.5" fill="#FFFFFF" class="glow-cyan" />
  <circle cx="64" cy="54" r="8" fill="none" stroke="#00F0FF" stroke-width="1" stroke-dasharray="3 3" />

  <!-- Micro HUD Technical Readouts -->
  <text x="36" y="22" font-family="'Courier New', monospace" font-size="6.5" font-weight="700" fill="#FFB000" letter-spacing="0.1em">SEC//01</text>
  <text x="76" y="112" font-family="'Courier New', monospace" font-size="6.5" font-weight="700" fill="#00FF66" letter-spacing="0.1em">GRID:ACTIVE</text>
</svg>
